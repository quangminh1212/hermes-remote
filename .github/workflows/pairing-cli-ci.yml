name: pairing-cli CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/pairing-cli/**'
      - '.github/workflows/pairing-cli-ci.yml'
  pull_request:
    paths:
      - 'packages/pairing-cli/**'
      - '.github/workflows/pairing-cli-ci.yml'
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: pairing-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package claims win32, darwin and linux support in `package.json`, and
  # its riskiest code is platform-specific: Windows `.cmd` shim resolution,
  # `quoteForCmd`, `spawn` behaviour, and the cloudflared asset name. A single
  # Linux runner would pass while the Windows path — the one that actually
  # broke — stayed untested.
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
        exclude:
          # macOS is the most expensive runner and the least likely to differ
          # from Linux for this package, so it runs a single node version.
          - os: macos-latest
            node: '22'
    defaults:
      run:
        working-directory: packages/pairing-cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Fails the job on any finding. The rules are the ones that have caught
      # real bugs here: a duplicate `module.exports` that silently discarded
      # another export, and unresolvable relative requires.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Coverage thresholds live in the npm script, so CI cannot drift from
      # what a developer runs locally.
      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: pairing-cli-coverage
          path: packages/pairing-cli/coverage/
          if-no-files-found: ignore

  # A packaging check, because this ships via `npx`: a file left out of
  # `package.json#files` would install fine and then fail at require time.
  pack:
    name: pack-and-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pairing-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pack the tarball
        run: npm pack

      - name: Install it into a clean project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer
          cd consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/packages/pairing-cli/hermes-remote-*.tgz

      - name: The library entry point loads
        working-directory: ${{ runner.temp }}/consumer
        run: node -e "require('hermes-remote')"

      - name: The CLI binary is installed and runs
        working-directory: ${{ runner.temp }}/consumer
        run: |
          test -x node_modules/.bin/hermes-remote
          node_modules/.bin/hermes-remote --help | grep -qi usage

      - name: Every referenced module shipped in the tarball
        working-directory: ${{ runner.temp }}/consumer
        run: node -e "const r=require('hermes-remote'); if(!r.createServer) throw new Error('createServer missing')"
