name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle*') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Unit tests cover the Assistant intent contract, the SSE parser, config
      # parsing and the update checker — all pure JVM, no emulator required.
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: apps/android/app/build/reports/tests/testDebugUnitTest/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-remote-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
